[project]
name = "sslae"
version = "0.1.0"
description = "Autoencoder-based semi-supervised learning from tabular data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sintija Petrushevski" }]
requires-python = "==3.10.*"
dependencies = [
    "numpy==1.25.2",
    "pytorch-lightning==2.0.6",
    "rich==13.5.2",
    "scikit-learn==1.3.2",
    "setuptools<80.9",
    "torch==2.1.2",
    "jupyter==1.1.1",
    "openml==0.14.1",
    "pandas==1.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
